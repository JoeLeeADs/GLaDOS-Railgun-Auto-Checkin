name: GLaDOS/Railgun 自动签到

on:
  workflow_dispatch:
    inputs:
      notify:
        description: '本次是否推送通知'
        type: choice
        options:
          - 'always'   # 始终推送（默认）
          - 'auto'     # 按脚本策略：当天已签到则静默跳过
        default: 'always'
  schedule:
    - cron: '18 9 * * *'          # 主运行：北京时间每天 09:18
      timezone: 'Asia/Shanghai'
    - cron: '18 14 * * *'         # 兜底①：北京时间 14:18（当天已签到则静默跳过，不重复推送）
      timezone: 'Asia/Shanghai'
    - cron: '18 21 * * *'         # 兜底②：北京时间 21:18（同上）
      timezone: 'Asia/Shanghai'
    - cron: '0 0 1 * *'           # 每月 1 号空提交保活，防止 Actions 被自动停用
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

jobs:
  checkin:
    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai           # 统一日志时区为北京时间（runner 默认 UTC）
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checkin
        env:
          # 手动触发默认始终推送（便于预览/排查），也可选 auto 让脚本按策略决定；
          # 定时触发时按脚本策略：当天已签到则静默跳过。仓库 Variables 里 NOTIFY_ALWAYS=true 可强制每次都推送。
          NOTIFY_ALWAYS: ${{ vars.NOTIFY_ALWAYS == 'true' || (github.event_name == 'workflow_dispatch' && inputs.notify == 'always') }}
          COOKIES: ${{ secrets.COOKIES }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          DOMAINS: ${{ secrets.DOMAINS }}
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          YUNHU_TOKEN: ${{ secrets.YUNHU_TOKEN }}
          YUNHU_RECV_ID: ${{ secrets.YUNHU_RECV_ID }}
          YUNHU_RECV_TYPE: ${{ secrets.YUNHU_RECV_TYPE }}
        run: python checkin.py

  keepalive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
